# Main runtime configuration.
# ${VAR} / ${VAR:-default} are expanded from environment variables / .env.

app:
  timezone: Asia/Jakarta
  language: id
  owner_telegram_id: ${OWNER_ID:-}
  log_level: ${LOG_LEVEL:-INFO}

llm:
  # Universal model support via LiteLLM:
  # Examples:
  #   - Google Gemini:  provider: "gemini", chat_model: "gemini-2.5-flash"
  #   - OpenRouter:     provider: "openrouter", chat_model: "anthropic/claude-3.5-sonnet"
  #   - Anthropic:      provider: "anthropic", chat_model: "claude-3-5-sonnet-20241022"
  #   - OpenAI:         provider: "openai", chat_model: "gpt-4o"
  #   - DeepSeek:       provider: "deepseek", chat_model: "deepseek-chat"
  #   - Groq:           provider: "groq", chat_model: "llama-3.3-70b-versatile"
  #   - Ollama (local): provider: "ollama", chat_model: "llama3.2" (set LLM_BASE_URL=http://localhost:11434)
  provider: gemini
  # Verify availability with: python -m app.main --check
  chat_model: "gemini-3.5-flash-lite"
  utility_model: "gemini-3.1-flash-lite"   # fast/cheap model for extraction, summaries, life
  base_url: ${LLM_BASE_URL:-}
  temperature_chat: 0.9
  temperature_utility: 0.2
  # Reasoning effort for models with thinking/reasoning (e.g. OpenAI o1/o3, OpenRouter Nemotron/DeepSeek):
  # Options: "none" (turn off thinking for instant chat), "low", "medium", "high", or null
  reasoning_effort: "none"
  max_output_tokens_chat: 300
  history_window_messages: 24
  request_timeout_seconds: 30
  max_retries: 3

conversation:
  debounce_seconds: 4
  max_bubbles: 2
  max_bubble_chars: 140
  typing_delay:
    min_seconds: 1.0
    max_seconds: 6.0
    chars_per_second: 25

proactive:
  daily_cap: 4
  quiet_hours: { start: "22:00", end: "06:00" }
  windows:
    - { name: morning,   start: "06:00", end: "08:00", chance: 0.80 }
    - { name: midday,    start: "12:00", end: "14:00", chance: 0.70 }
    - { name: afternoon, start: "15:30", end: "17:30", chance: 0.40 }
    - { name: evening,   start: "19:00", end: "21:00", chance: 0.60 }
  bonus: { chance: 0.25, max_per_day: 1, awake_start: "09:00", awake_end: "21:30" }
  skip_if_user_active_within_minutes: 20
  backoff_after_ignored: 2
  stop_after_ignored: 4
  message_type_weights:
    checkin: 3
    followup: 4
    activity: 3
    joke: 2
    thought: 2
    question: 2

memory:
  nightly_job_time: "23:30"
  daily_life_job_time: "05:30"
  thread_expire_days: 7
  rolling_summary_every_days: 7

storage:
  db_path: companion.db        # relative to DATA_DIR
  backup_dir: backups          # relative to DATA_DIR
  log_dir: logs                # relative to DATA_DIR

backup:
  daily_time: "03:00"
  keep_days: 14

# Shown when the user expresses serious distress. Owner must verify and fill in local resources.
safety:
  crisis_resources:
    - "Layanan Sejiwa Kemenkes: telepon 119 ext. 8 (verifikasi dulu sebelum dipakai)"
    - "Orang tepercaya terdekat (keluarga/teman) atau psikolog/psikiater setempat"
